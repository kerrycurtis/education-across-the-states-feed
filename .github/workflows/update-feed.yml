name: Write redirect stub feed

on:
  schedule:
    - cron: '20 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Write redirect feed.xml (feed moved to the Education Across the States GitHub organization)
        run: |
          cp stub-feed.xml feed.xml
          echo "wrote redirect feed.xml (0 episodes, itunes:new-feed-url -> organization feed)"
      - name: Commit and push if changed
        run: |
          git config user.name "podcast-feed-bot"
          git config user.email "podcast-feed-bot@users.noreply.github.com"
          if git diff --quiet -- feed.xml; then
            echo "feed.xml unchanged, nothing to commit"
          else
            git add feed.xml
            git commit -m "Redirect feed to Education Across the States organization"
            git push
          fi
